<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered Students | QuizMaster Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <header class="navbar">
        <!-- Rendered by common.js -->
    </header>

    <div style="padding: 100px 8% 40px 8%; max-width: 1200px; margin: auto;">
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px;">
            <div>
                <h1 style="font-size: 30px; color: #0f172a; margin: 0;"><i class="fa-solid fa-users" style="color: #2563eb;"></i> Registered Students</h1>
                <p style="color: #64748b; margin-top: 4px;">Roster of all registered users on the platform</p>
            </div>
            <a href="admin-dashboard.html" class="primary-btn">
                <i class="fa-solid fa-arrow-left"></i> Admin Dashboard
            </a>
        </div>

        <div style="background: white; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.06); overflow: hidden; border: 1px solid #e2e8f0;">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>College</th>
                        <th>Course</th>
                        <th>Role</th>
                    </tr>
                </thead>
                <tbody id="studentTable">
                    <tr>
                        <td colspan="7" style="text-align: center; padding: 40px;">
                            <i class="fa-solid fa-spinner fa-spin" style="font-size: 24px; color: #2563eb;"></i>
                            <p style="margin-top: 10px; color: #64748b;">Loading registered student roster...</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <footer>
        <p>© 2026 QuizMaster | Placement Assessment Platform</p>
    </footer>

    <script src="js/common.js"></script>
    <script src="js/students.js"></script>
</body>

</html>
