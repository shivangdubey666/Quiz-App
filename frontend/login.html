<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | QuizMaster</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar">

<div class="nav-left">

<a href="index.html">Home</a>

<a href="dashboard.html">Dashboard</a>

<a href="leaderboard.html">Leaderboard</a>

</div>



</header>

<div class="container">

    <div class="card">

        <h1>QuizMaster</h1>

        <h3>Login Student/Admin</h3>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Enter Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Enter Password"
                required
            >

            <button type="submit">

                Login

            </button>

        </form>

        <p>

            New Student?

            <a href="register.html">

                Register Here

            </a>

        </p>

    </div>

</div>

<script src="js/login.js"></script>

</body>
</html>
