<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | QuizMaster</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

    <header class="navbar">
        <!-- Rendered by common.js -->
    </header>

    <div class="container">
        <div class="card">
            <div style="text-align: center; margin-bottom: 20px;">
                <i class="fa-solid fa-graduation-cap" style="font-size: 40px; color: #2563eb;"></i>
                <h1 style="margin-top: 10px;">QuizMaster</h1>
                <p style="color: #64748b;">Sign in to access your placement dashboard</p>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <label for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
                    <input type="email" id="email" placeholder="student@college.edu" required>
                </div>

                <div class="input-group">
                    <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" id="submitBtn">
                    <i class="fa-solid fa-right-to-bracket"></i> Login
                </button>
            </form>

            <p style="text-align: center; margin-top: 20px; color: #64748b;">
                New Student? <a href="register.html">Register Here</a>
            </p>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
