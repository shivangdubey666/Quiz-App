<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | QuizMaster</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body>

    <header class="navbar">
        <!-- Rendered by common.js -->
    </header>

    <div style="padding: 100px 8% 40px 8%; max-width: 1300px; margin: auto;">
        
        <!-- Welcome Banner -->
        <div style="background: linear-gradient(135deg, #1e293b, #2563eb); color: white; padding: 35px; border-radius: 16px; margin-bottom: 35px; box-shadow: 0 10px 25px rgba(37, 99, 235, 0.2); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px;">
            <div>
                <h1 style="font-size: 32px; margin-bottom: 8px;">Welcome, <span id="welcomeUsername">Student</span> 👋</h1>
                <p style="color: #cbd5e1; font-size: 16px;">Access your unlocked placement assessments or explore new quizzes.</p>
            </div>
            <div>
                <a href="leaderboard.html" class="primary-btn" style="background: white; color: #2563eb; font-weight: 600;">
                    <i class="fa-solid fa-trophy" style="color: #eab308;"></i> View Leaderboard
                </a>
            </div>
        </div>

        <!-- My Performance Stats -->
        <div class="stat-grid">
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-unlock-keyhole"></i></div>
                <div class="stat-info">
                    <h4>Purchased Quizzes</h4>
                    <p id="statPurchased">0</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(16, 185, 129, 0.1); color: #10b981;"><i class="fa-solid fa-circle-check"></i></div>
                <div class="stat-info">
                    <h4>Quizzes Attempted</h4>
                    <p id="statAttempted">0</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(234, 179, 8, 0.1); color: #eab308;"><i class="fa-solid fa-star"></i></div>
                <div class="stat-info">
                    <h4>Best Percentage</h4>
                    <p id="statBestScore">0%</p>
                </div>
            </div>
        </div>

        <!-- Available Quizzes Section -->
        <h2 style="text-align: left; margin-bottom: 25px; font-size: 26px; color: #0f172a;">All Quizzes & Assessments</h2>
        <div class="quiz-container" id="studentQuizContainer">
            <div style="grid-column: 1/-1; text-align: center; padding: 40px;">
                <i class="fa-solid fa-spinner fa-spin" style="font-size: 32px; color: #2563eb;"></i>
                <p style="margin-top: 10px; color: #64748b;">Loading available assessments...</p>
            </div>
        </div>

    </div>

    <!-- Footers & Scripts -->
    <footer style="margin-top: 60px;">
        <p>© 2026 QuizMaster | Placement Assessment Platform</p>
    </footer>

    <script src="js/common.js"></script>
    <script src="js/dashboard.js"></script>
</body>

</html>
