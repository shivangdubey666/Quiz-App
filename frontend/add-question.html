<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Add Question</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

<div class="card">

<h1>Add Question</h1>

<form id="questionForm">

<input
type="number"
id="quizId"
placeholder="Quiz ID"
required>

<textarea
id="question"
placeholder="Question"
rows="4"
required></textarea>

<input
type="text"
id="option1"
placeholder="Option 1"
required>

<input
type="text"
id="option2"
placeholder="Option 2"
required>

<input
type="text"
id="option3"
placeholder="Option 3"
required>

<input
type="text"
id="option4"
placeholder="Option 4"
required>

<input
type="text"
id="answer"
placeholder="Correct Answer"
required>

<button type="submit">

Add Question

</button>

</form>

<br>

<button onclick="window.location.href='admin-dashboard.html'">

Back

</button>

</div>

</div>

<script src="js/add-question.js"></script>
<script src="js/common.js"></script>
</body>

</html>
