<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | QuizMaster</title>

<link rel="stylesheet" href="css/style.css">

</head>
<body>

    <header class="navbar">

<div class="nav-left">

<a href="index.html">Home</a>

<a href="dashboard.html">Dashboard</a>

<a href="leaderboard.html">Leaderboard</a>

</div>

<div class="nav-right">

<a href="#" id="logoutBtn">Logout</a>

</div>

</header>

<div class="container">

<div class="card">

<h1>QuizMaster</h1>

<h3>Create Student Account</h3>

<form id="registerForm">

<input
type="text"
id="username"
placeholder="Choose Username"
required>

<input
type="email"
id="email"
placeholder="Email"
required>

<input
type="text"
id="mobile"
placeholder="Mobile Number"
required>

<input
type="text"
id="college"
placeholder="College Name"
required>

<input
type="text"
id="branch"
placeholder="Course"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>

<button type="submit">

Register

</button>

</form>

<p>

Already Registered?

<a href="login.html">

Login Here

</a>

</p>

</div>

</div>

<script src="js/register.js"></script>

</body>
</html>
